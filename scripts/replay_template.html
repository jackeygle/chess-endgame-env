<title>Endgame Replays</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: run tabs on top, game chips, then board beside its move list (stacks on phones). */
:root{
  --bg:#f4f5f2; --panel:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#d9ded8;
  --light:#e9e4d4; --dark:#7d927f; --accent:#2f6b4f; --win:#2f6b4f; --bad:#b4372c; --hl:#e8c547;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1c2320; --fg:#e7ece8; --muted:#9aa8a0; --line:#2c3632;
  --light:#c9c3ae; --dark:#5d7262; --accent:#6fbf94; --win:#6fbf94; --bad:#ef7a6f; --hl:#d9b63c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1c2320; --fg:#e7ece8; --muted:#9aa8a0; --line:#2c3632;
  --light:#c9c3ae; --dark:#5d7262; --accent:#6fbf94; --win:#6fbf94; --bad:#ef7a6f; --hl:#d9b63c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:clamp(26px,4vw,36px);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:68ch}
.tabs,.chips{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.tab b{font-family:var(--mono);font-weight:600;margin-left:6px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:118px}
.chip[aria-pressed=true]{border-color:var(--fg)}
.chip .m{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.pill.mate{color:var(--win)} .pill.bad{color:var(--bad)} .pill.open{color:var(--muted)}
.stage{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.boardwrap{flex:0 1 440px;min-width:0;max-width:100%}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;max-width:100%;border:2px solid var(--fg);border-radius:4px;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(22px,6vw,42px);line-height:1;position:relative;user-select:none}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq.from::after,.sq.to::after{content:"";position:absolute;inset:0;background:var(--hl);opacity:.45}
.sq.to.lost::after{background:var(--bad);opacity:.6}
.sq span{position:relative;z-index:1}
.pw{color:#fbfaf6;text-shadow:0 0 2px #000,0 0 1px #000} .pb{color:#14110f}
.files{display:grid;grid-template-columns:repeat(8,1fr);font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.controls .pos{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:auto}
.side{flex:1 1 280px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.side h2{font-family:var(--display);font-size:18px;margin:0 0 4px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-family:var(--mono)}
.moves{font-family:var(--mono);font-size:13px;max-height:320px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px}
.mv{padding:2px 6px;border-radius:4px;border:1px solid transparent;cursor:pointer;background:none}
.mv[aria-current=true]{border-color:var(--accent)}
.mv.lost{color:var(--bad);font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:10px}
</style>
<main>
  <header>
    <h1>Endgame Replays</h1>
    <p class="sub">Six won chess endgames, White to mate a Stockfish defender. Pick a player, a game, then step through the moves. Red marks a White piece being captured.</p>
  </header>
  <div class="tabs" id="tabs" role="group" aria-label="Player"></div>
  <div class="chips" id="chips" role="group" aria-label="Game"></div>
  <section class="stage">
    <div class="boardwrap">
      <div class="board" id="board" aria-label="Chess board"></div>
      <div class="files"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
      <div class="controls">
        <button id="first" aria-label="First position">⏮</button>
        <button id="prev" aria-label="Previous move">◀</button>
        <button id="play" aria-label="Play">▶ Play</button>
        <button id="next" aria-label="Next move">▶</button>
        <button id="last" aria-label="Last position">⏭</button>
        <span class="pos" id="pos"></span>
      </div>
    </div>
    <aside class="side">
      <h2 id="gtitle"></h2>
      <dl class="facts" id="facts"></dl>
      <div class="moves" id="moves"></div>
      <p class="note" id="note"></p>
    </aside>
  </section>
</main>
<script>
const RUNS = /*DATA*/null;
const G = {"K":"♔","Q":"♕","R":"♖","B":"♗","N":"♘","P":"♙","k":"♚","q":"♛","r":"♜","b":"♝","n":"♞","p":"♟"};
const NAMES = {KQK:"King and queen vs king",KRK:"King and rook vs king",KBBK:"Two bishops vs king",KQKR:"Queen vs rook",KBNK:"Bishop and knight vs king"};
let run=0, game=0, step=0, timer=null;
const $=id=>document.getElementById(id);
const statusClass=s=>s==="mate"?"mate":(s==="in_progress"||s==="not_started")?"open":"bad";
const statusText=s=>({mate:"Mate",draw:"Draw",stalemate:"Stalemate",move_limit:"Out of moves",lost:"Lost",in_progress:"Unfinished",not_started:"Not started"}[s]||s);
function parse(fen){const rows=fen.split("/");const sq={};rows.forEach((r,i)=>{let f=0;for(const c of r){if(/\d/.test(c))f+=+c;else{sq["abcdefgh"[f]+(8-i)]=c;f++}}});return sq}
function tabs(){$("tabs").innerHTML="";RUNS.forEach((r,i)=>{const b=document.createElement("button");b.className="tab";b.setAttribute("aria-pressed",i===run);b.innerHTML=r.label+"<b>"+r.reward.toFixed(2)+"</b>";b.onclick=()=>{run=i;game=0;step=0;stop();render()};$("tabs").appendChild(b)})}
function chips(){$("chips").innerHTML="";RUNS[run].games.forEach((g,i)=>{const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",i===game);b.innerHTML=`<span>${g.id} · ${g.material}</span><span class="pill ${statusClass(g.status)}">${statusText(g.status)}</span><span class="m">reward ${g.reward.toFixed(2)}</span>`;b.onclick=()=>{game=i;step=0;stop();render()};$("chips").appendChild(b)})}
function board(){const g=RUNS[run].games[game],fr=g.frames[step],sq=parse(fr.fen);const el=$("board");el.innerHTML="";
 for(let r=8;r>=1;r--)for(let f=0;f<8;f++){const n="abcdefgh"[f]+r;const d=document.createElement("div");d.className="sq "+((f+r)%2?"l":"d");
  if(fr.from===n)d.classList.add("from");if(fr.to===n){d.classList.add("to");if(fr.lost)d.classList.add("lost")}
  const p=sq[n];if(p){const s=document.createElement("span");s.textContent=G[p];s.className=p===p.toUpperCase()?"pw":"pb";d.appendChild(s)}el.appendChild(d)}
 $("pos").textContent=`${step} / ${g.frames.length-1}`}
function side(){const g=RUNS[run].games[game];$("gtitle").textContent=`${g.id} · ${NAMES[g.material]||g.material}`;
 $("facts").innerHTML=`<dt>Result</dt><dd>${statusText(g.status)}</dd><dt>Moves used</dt><dd>${g.moves_used} of ${g.limit}</dd><dt>Shortest mate</dt><dd>${g.mate}</dd><dt>Reward</dt><dd>${g.reward.toFixed(3)}</dd>`;
 const m=$("moves");m.innerHTML="";g.frames.forEach((f,i)=>{if(!i)return;const b=document.createElement("button");b.className="mv"+(f.lost?" lost":"");b.textContent=f.label;b.setAttribute("aria-current",i===step);b.onclick=()=>{step=i;stop();render()};m.appendChild(b)});
 const lost=g.frames.findIndex(f=>f.lost);$("note").textContent=lost>0?`White loses material at ${g.frames[lost].label}.`:(g.frames.length===1?"No moves were played in this game.":"")}
function render(){tabs();chips();board();side()}
function stop(){if(timer){clearInterval(timer);timer=null;$("play").textContent="▶ Play"}}
$("first").onclick=()=>{step=0;stop();render()};$("last").onclick=()=>{step=RUNS[run].games[game].frames.length-1;stop();render()};
$("prev").onclick=()=>{step=Math.max(0,step-1);stop();render()};$("next").onclick=()=>{step=Math.min(RUNS[run].games[game].frames.length-1,step+1);stop();render()};
$("play").onclick=()=>{if(timer)return stop();$("play").textContent="⏸ Pause";timer=setInterval(()=>{const n=RUNS[run].games[game].frames.length-1;if(step>=n)return stop();step++;board();side()},matchMedia("(prefers-reduced-motion: reduce)").matches?1200:700)};
render();
</script>
